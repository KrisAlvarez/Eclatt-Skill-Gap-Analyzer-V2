services:
  - type: web
    name: skillgap-api
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: PYTHONPATH
        value: .
